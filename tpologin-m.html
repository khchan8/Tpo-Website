  <style>
    :root {
      --bg-paper: #f6f4ef;
      --bg-warm-white: #ffffff;
      --bg-stone: #ede9e0;
      --ink-dark: #18221f;
      --ink-body: #2d3834;
      --ink-muted: #5c6661;
      --forest: #1f4737;
      --forest-hover: #163629;
      --terracotta: #b55428;
      --rule-color: #d8d3c8;
      --font-serif: 'Newsreader', Georgia, serif;
      --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      color: var(--ink-body);
      background-color: #3b6982;
      margin: 0;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, .serif-heading {
      font-family: var(--font-serif);
      color: var(--ink-dark);
      font-weight: 500;
      letter-spacing: -0.015em;
    }

    .mono-label {
      font-family: var(--font-mono);
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);

    a { text-decoration: none; transition: color 0.2s ease, background-color 0.2s ease, border-color 0.2s ease; }

      position: fixed;
      inset: 0;
      z-index: 0;

    .page-shell {

      z-index: 1;
      display: flex;
      flex-direction: column;

    /* ======= Top Bar (matches index.html) ======= */

      background: #141d1a;
      color: rgba(255, 255, 255, 0.82);
      font-size: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    #topbar .contact-info {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px 14px;
    }

    #topbar .contact-info i {
      color: #a3bfb2;
      font-style: normal;
      display: inline-flex;
      align-items: center;
    }

    #topbar .contact-info a,
    #topbar .contact-info span {
      padding-left: 5px;
      color: rgba(255, 255, 255, 0.82);
    }

    /* ======= Header (mobile-first brand bar) ======= */
    #header {
      background: rgba(20, 29, 26, 0.55);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 0;
    }

    .logo-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #f6f4ef;
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 4px;
      background: var(--forest);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #f6f4ef;
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.03em;
      flex: 0 0 auto;
    }

    .logo-brand .brand-name {
      display: block;
      font-weight: 700;
      line-height: 1.1;
      font-size: 1.02rem;
      color: #f6f4ef;
    }

    .logo-brand .brand-sub {
      display: block;
      font-family: var(--font-mono);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(246, 244, 239, 0.75);
      margin-top: 3px;
    }

    /* ======= Login Section ======= */
    .login-section {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .login-container {
      background: var(--bg-warm-white);
      border: 1px solid var(--rule-color);
      border-radius: 6px;
      box-shadow: 0 18px 45px rgba(9, 27, 20, 0.28);
      padding: 28px 22px;
      width: 100%;
      max-width: 420px;
    }

    .login-container h1 {
      font-size: 24px;
      margin: 6px 0 20px;
      text-align: left;
    }

    .form-group { margin-bottom: 16px; }

    .form-label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink-dark);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--rule-color);
      border-radius: 4px;
      background: var(--bg-paper);
      color: var(--ink-body);
      font-size: 16px; /* prevents iOS zoom-on-focus */
      font-family: var(--font-sans);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--forest);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(31, 71, 55, 0.12);
    }

    .btn-primary-editorial {
      background: var(--forest);
      color: #ffffff;
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 14.5px;
      padding: 13px 24px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--forest);
      width: 100%;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary-editorial:hover { background: var(--forest-hover); }
    .btn-primary-editorial:disabled { background: #9aa8a1; border-color: #9aa8a1; cursor: not-allowed; }

    .error-message {
      color: var(--terracotta);
      margin-top: 14px;
      min-height: 1.2em;
      font-size: 14px;
      text-align: center;
      font-family: var(--font-mono);
    }

    .info-message {
      margin-top: 22px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 13.5px;
      border-top: 1px solid var(--rule-color);
      padding-top: 16px;
    }

    /* ======= Footer (minimal, matches index.html tone) ======= */
    #footer {
      background: #141d1a;
      color: rgba(255, 255, 255, 0.65);
      font-size: 12px;
      padding: 14px 0;
    }

    #footer .container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      align-items: center;
      justify-content: space-between;
    }

    #footer a { color: rgba(255, 255, 255, 0.8); }
    #footer a:hover { color: #ffffff; }
  </style>

</head>
<body>

  <!-- Fixed 3D clouds background (same Vanta config as index.html hero) -->
  <div id="vanta-bg" aria-hidden="true"></div>

  <div class="page-shell">

    <!-- ======= Top Bar ======= -->
    <section id="topbar">
      <div class="container">
        <div class="contact-info">
          <i class="bi bi-envelope"><a href="mailto:info@tpo-wellness.com">info@tpo-wellness.com</a></i>
          <i class="bi bi-phone"><a href="tel:+66877894950">+66 87 789 4950</a></i>
        </div>
      </div>
    </section>

    <!-- ======= Header ======= -->
    <header id="header">
      <div class="container d-flex align-items-center justify-content-between">
        <a href="index.html" class="logo-brand" title="TPO Wellness Ltd. Bangkok">
          <span class="logo-mark">TPO</span>
          <span>
            <span class="brand-name">TPO Wellness Ltd.</span>
            <span class="brand-sub">Bangkok OEM Gummies &bull; Herbal &bull; Clinic</span>
          </span>
        </a>
        <a class="mono-label" href="index.html#hero" style="color: rgba(246,244,239,0.85);">Home</a>
      </div>
    </header>

    <!-- ======= Login Section ======= -->
    <main class="login-section">
      <div>
        <div class="login-container">
          <span class="mono-label">Staff &amp; Partner Portal &mdash; Mobile</span>
          <h1>Employee Login</h1>
          <div id="login-form">
            <div class="form-group">
              <label class="form-label" for="email">Email</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="name@tpo-wellness.com" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="button" id="loginButton" class="btn-primary-editorial" onclick="login()">Sign In</button>
            <div id="error-message" class="error-message"></div>
          </div>

          <div class="info-message">
            <p>If you're having trouble logging in, please contact your administrator.</p>
          </div>
        </div>
      </div>
    </main>

    <!-- ======= Footer ======= -->
    <footer id="footer">
      <div class="container">
        <div>&copy; <span>TPO Wellness Ltd.</span> All Rights Reserved</div>
        <div class="mono-label" style="color: #c7dfd4;">Bangkok, Thailand</div>
      </div>
    </footer>

  </div><!-- /.page-shell -->

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Vanta Clouds Background Initialization (same palette as index.html) -->
  <script>
    let loginVantaEffect = null;

    function initLoginClouds() {
      const bgEl = document.getElementById('vanta-bg');
      if (!bgEl || typeof VANTA === 'undefined' || !VANTA.CLOUDS) return;

      if (loginVantaEffect && typeof loginVantaEffect.destroy === 'function') {
        loginVantaEffect.destroy();
        loginVantaEffect = null;
      }

      try {
        loginVantaEffect = VANTA.CLOUDS({
          el: '#vanta-bg',
          mouseControls: false,
          touchControls: false,
          gyroControls: false,
          minHeight: 360.00,
          minWidth: 200.00,
          skyColor: 0x3b6982,
          cloudColor: 0xc8d6e5,
          cloudShadowColor: 0x162d3d,
          sunColor: 0xf59e0b,
          sunGlareColor: 0xd97706,
          sunlightColor: 0xfde68a,
          speed: 0.70
        });
      } catch (err) {
        console.warn('Vanta Clouds initialization notice:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', initLoginClouds);
  </script>

  <!-- Login Script (JSONP — same endpoint & flow as tpologin.html; logic preserved) -->
  <script>
    // Google Apps Script URL for Employee Login
    // FIX: now points to the same deployed Tpologin.gs web app as tpologin.html.
    // The old mobile-specific deployment was stale and used fetch(), which is
    // blocked client-side (see Mobile_Login_Resolution_Summary.md) — JSONP is not.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwW9cq4dhPxVPr98Wq2IsV5d7C08DJ1qGVbPEMWtSnWfN2GEwXj8H3wEsDJvNaMfiec0w/exec';

    // Get error message from URL parameters (if any)
    const urlParams = new URLSearchParams(window.location.search);
    const errorParam = urlParams.get('error');

    const errorDiv = document.getElementById('error-message');
    const loginButton = document.getElementById('loginButton');

    // Function to disable/enable buttons
    function setButtonsDisabled(disabled) {
        if(loginButton) loginButton.disabled = disabled;
    }

    // Employee login function (JSONP — mirrors tpologin.html)
    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      errorDiv.textContent = ''; // Clear previous errors

      if (!email || !password) {
        errorDiv.textContent = 'Please enter both email and password';
        return;
      }

      errorDiv.textContent = 'Logging in...';
      setButtonsDisabled(true);

      // --- JSONP Implementation ---
      const callbackName = 'handleLoginResponse';
      const scriptId = 'jsonp-' + callbackName + '-' + Date.now();
      let script = null;
      let timeoutId = null;

      // Define the global callback function
      window[callbackName] = function(data) {
        console.log('Login response data (JSONP):', data);

        // Cleanup: Remove the script tag and the global callback function
        if (script && script.parentNode) {
          script.parentNode.removeChild(script);
        }
        delete window[callbackName];
        if (timeoutId) clearTimeout(timeoutId);

        setButtonsDisabled(false);
        try {
          // Check the new success flag and necessary fields from the JSON response
          if (data && data.success === true && data.sessionToken && data.grantedTokens && data.linkedPage) {
            errorDiv.textContent = '';
            console.log('Login success. Storing tokens and redirecting to ' + data.linkedPage + '...');

            // Store session token
            localStorage.setItem('tpoSessionToken', data.sessionToken);

            // Store granted tokens as a JSON string
            localStorage.setItem('tpoGrantedTokens', JSON.stringify(data.grantedTokens));

            // Store CRM API token if it exists
            if (data.crmApiToken) {
              localStorage.setItem('tpoCrmApiToken', data.crmApiToken);
            } else {
              // Ensure any old CRM token is cleared if not provided this time
              localStorage.removeItem('tpoCrmApiToken');
            }

            // Store user email for display purposes
            localStorage.setItem('tpoUserEmail', data.email);

            // Redirect to the linked page. Browser handles relative paths correctly.
            window.top.location.href = data.linkedPage;

          } else {
            // Display the error message from the script's JSON response
            errorDiv.textContent = data.message || 'Login failed. Please check your credentials or configuration.';
            console.log("Login failed:", data.message || 'Unknown error or missing data in response', data);
            // Clear any potentially partially stored tokens on failure
            localStorage.removeItem('tpoSessionToken');
            localStorage.removeItem('tpoGrantedTokens');
            localStorage.removeItem('tpoCrmApiToken');
          }
        } catch (error) {
           console.error('Error processing login response:', error);
           errorDiv.textContent = 'Error processing login response: ' + error.message;
           localStorage.removeItem('tpoSessionToken');
           localStorage.removeItem('tpoGrantedTokens');
           localStorage.removeItem('tpoCrmApiToken');
        }
      };

      // Timeout for JSONP error handling (e.g., 15 seconds)
      timeoutId = setTimeout(() => {
        console.error('JSONP request timed out.');
        errorDiv.textContent = 'Error: Login request timed out. Please try again.';
        if (script && script.parentNode) {
          script.parentNode.removeChild(script);
        }
        delete window[callbackName];
        setButtonsDisabled(false);
      }, 15000);

      // Construct the JSONP URL
      const loginUrl = new URL(APPS_SCRIPT_URL);
      loginUrl.searchParams.append('action', 'handleLogin');
      loginUrl.searchParams.append('email', email);
      loginUrl.searchParams.append('password', password);
      loginUrl.searchParams.append('callback', callbackName);

      // Create and append the script tag
      script = document.createElement('script');
      script.id = scriptId;
      script.src = loginUrl.toString();
      console.log('Requesting JSONP URL:', script.src);
      document.head.appendChild(script);
    }

    // Add event listener for Enter key in password field
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
         if (!loginButton || !loginButton.disabled) {
            login();
         }
      }
    });

    // Display error message from URL parameter on load
    document.addEventListener('DOMContentLoaded', function() {
      if (errorParam) {
        errorDiv.textContent = decodeURIComponent(errorParam);
      }
    });
  </script>

</body>
